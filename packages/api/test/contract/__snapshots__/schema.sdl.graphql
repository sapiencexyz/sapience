"""
Record of a settled prediction redemption where a holder burns tokens for collateral
"""
type Claim {
  chainId: Int!
  collateralPaid: String!
  holder: String!
  id: Int!
  marketAddress: String!
  positionToken: String!

  """
  Misnomer: this is the redeemed position's pickConfigId, NOT a Prediction.predictionId.
  Backed by the Claim.pickConfigId column; the GraphQL field name is kept only for
  backward compatibility on this deprecated query.
  """
  predictionId: String!
  redeemedAt: Int!
  refCode: String
  tokensBurned: String!
  txHash: String!
}

"""
Record of a position close where both sides burn tokens and receive payouts
"""
type Close {
  burnedAt: Int!
  chainId: Int!
  counterpartyHolder: String!
  counterpartyPayout: String!
  counterpartyTokensBurned: String!
  id: Int!
  marketAddress: String!
  pickConfigId: String!
  predictorHolder: String!
  predictorPayout: String!
  predictorTokensBurned: String!
  refCode: String
  txHash: String!
}

