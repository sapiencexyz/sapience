  accuracyScore: Float!
  address: String!
  rank: Int
  totalForecasters: Int!
}

"""
A single activity entry — either a prediction or a trade, sorted by timestamp
"""
type ActivityItem {
  prediction: Prediction

  """Unix seconds timestamp for sorting"""
  timestamp: Int!
  trade: ActivityTrade
