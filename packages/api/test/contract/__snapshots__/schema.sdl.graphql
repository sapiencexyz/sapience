}

"""Trade fields embedded in an activity item"""
type ActivityTrade {
  blockNumber: Int!
  buyer: String!
  chainId: Int!
  collateral: String!
  executedAt: Int!
  id: Int!
  pickConfig: PickConfiguration
  price: String!
  seller: String!
  token: String!
  tokenAmount: String!
  tradeHash: String!
  txHash: String!
}

