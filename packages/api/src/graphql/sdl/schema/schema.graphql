  address: Address
  """
  Restrict to a single chain. Defaults to the SDK's `DEFAULT_CHAIN_ID`
  when omitted.
  """
  chainId: Int
}

"""
Protocol-wide stats snapshot. When the deprecated `Query.protocolStats(vaultAddress:)`
arg is set, vault-scoped fields (the `vault*` block below) are populated alongside the
protocol-wide counters from the same fat-row pipeline that backs `vaultStats`.
"""
type ProtocolStat {
  """
  Snapshot boundary, aligned to the snapshot interval.
  """
  timestamp: UnixSeconds!
  cumulativeVolume: String!

  """
  Cumulative count of predictions and secondary trades/sales
  """
  cumulativeTradeCount: Int!

  """
  Trade-count delta over the snapshot interval
  """
  periodTradeCount: Int!

  """
  Cumulative-volume delta over the snapshot interval
  """
  periodVolume: String!
  openInterest: String!
  escrowBalance: String!

  """
  DEPRECATED — pre-split alias for `cumulativeTradeCount`. Kept so pinned external
  queries keep validating; new callers should read `cumulativeTradeCount`.
  """
  totalTradeCount: Int
    @deprecated(reason: "Use `cumulativeTradeCount`.")

  """
  DEPRECATED — realized PnL delta. Lives on `VaultStat.periodPnL` now and is
  only populated here when the row is vault-scoped (`protocolStats(vaultAddress:)`).
  """
  periodPnL: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).periodPnL` — only populated on vault-scoped rows.")

  """
  DEPRECATED — vault collateral balance. Only populated when the row is vault-scoped
  via `protocolStats(vaultAddress:)`.
  """
  vaultBalance: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).balance`.")
  vaultAvailableAssets: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).availableAssets`.")
  vaultDeployed: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).deployed`.")
  vaultCumulativePnL: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).cumulativePnL`.")
  vaultPositionsWon: Int
    @deprecated(reason: "Use `vaultStats(vaultAddress:).positionsWon`.")
  vaultPositionsLost: Int
    @deprecated(reason: "Use `vaultStats(vaultAddress:).positionsLost`.")
  vaultDeposits: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).deposits`.")
  vaultWithdrawals: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).withdrawals`.")
  vaultAirdropGains: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).airdropGains`.")
  vaultSecondaryBought: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).secondaryBought`.")
  vaultSecondarySold: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).secondarySold`.")
  vaultUnredeemedClaim: String
    @deprecated(reason: "Use `vaultStats(vaultAddress:).unredeemedClaim`.")
}

"""
One row of the per-account stats time series — wallet collateral
position, settlement PnL, trade volume, and prediction outcome counts
at a single snapshot boundary. Mirrors the fat-row pattern used by
`ProtocolStat` / `VaultStat`: per-bucket deltas use the `period…`
prefix, cumulative-through-bucket values use the `cumulative…` prefix.
Wei amounts are 18-decimal decimal strings; counts are integers.

Today this is assembled on-demand from the same SQL helpers that back
the deprecated `accountBalance` / `accountPnl` / `accountPredictionCount` /
`accountVolume` resolvers, projected to a fixed daily cadence. A
follow-up will introduce a real per-account snapshot table and swap
the resolver to read from it — the wire shape is the destination, so
clients are forward-compatible across that swap.
"""
type AccountStat {
  account: Account!

  """
  Snapshot boundary.
  """
  timestamp: UnixSeconds!

  """
  Realized PnL delta over this bucket (wei, 18 dec)
  """
  periodPnL: String!

  """
  Running cumulative realized PnL through this bucket (wei, 18 dec)
  """
  cumulativePnL: String!

  """
  Trade volume delta over this bucket (wei, 18 dec)
  """
  periodVolume: String!

  """
  Running cumulative trade volume through this bucket (wei, 18 dec)
  """
  cumulativeVolume: String!

  """
  Active collateral in open positions at this bucket (wei, 18 dec)
  """
  deployedCollateral: String!

  """
  Collateral available to claim from settled positions at this bucket (wei, 18 dec)
  """
  claimableCollateral: String!

  """
  Predictions opened in this bucket, total
  """
  predictionsTotal: Int!

  """
  Predictions won (settled in caller's favour) in this bucket
  """
  predictionsWon: Int!

  """
  Predictions lost in this bucket
  """
  predictionsLost: Int!

  """
  Predictions still pending at the bucket boundary
  """
  predictionsPending: Int!

  """
  Predictions settled non-decisively in this bucket
  """
  predictionsNonDecisive: Int!
}

"""
Vault-specific stats snapshot for a single vault address.
"""
type VaultStat {
  """
  Snapshot boundary, aligned to the snapshot interval.
  """
  timestamp: UnixSeconds!
  vault: Vault!
  balance: String!
  availableAssets: String!
  deployed: String!
  cumulativePnL: String!
  positionsWon: Int!
  positionsLost: Int!
  deposits: String!
  withdrawals: String!
  airdropGains: String!

  """
  Cumulative wUSDe paid by the vault on secondary-market buys
  """
  secondaryBought: String!

  """
  Cumulative wUSDe received by the vault on secondary-market sells
  """
  secondarySold: String!

  """
  wUSDe earmarked for the vault from resolved-but-not-yet-redeemed wins
  """
  unredeemedClaim: String!

  """
  Realized PnL delta over the snapshot interval
  """
  periodPnL: String!
}

