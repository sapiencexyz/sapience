  """
  collateral: String!
  executedAt: UnixSeconds!
  id: Int!
  """
  Total collateral paid by buyer (wei, 18 dec). `price / tokenAmount` is the per-share price.
  """
  price: String!
  refCode: String
  """
  Seller wallet address (lowercase 0x-hex).
  """
  seller: String!
  """
  Position token address being exchanged (lowercase 0x-hex).
  """
  token: String!
  """
  Quantity of position tokens transferred (wei, 18 dec on Sapience).
  """
  tokenAmount: String!
  """
  Canonical trade hash — the on-chain identifier (0x-prefixed).
  """
  tradeHash: String!
  txHash: String!
}

"""
Application-level user record, keyed by wallet address,
used for referrals and other per-wallet metadata.
"""
type User {
  _count: UserCount

  """
  Canonical Ethereum wallet address for this user.
  """
  address: String!
  createdAt: DateTimeISO!
  id: Int!

  """
  Maximum number of referrals this user's code allows. Default is 0,
  so codes are not usable until explicitly configured.
  """
  maxReferrals: Int!

  """
  keccak256(utf8(trimmed_lowercase_code)) stored as 0x-prefixed hex.
  """
  refCodeHash: String
  referrals(
    cursor: UserWhereUniqueInput
    distinct: [UserScalarFieldEnum!]
    orderBy: [UserOrderByWithRelationInput!]
    skip: Int
    take: Int
    where: UserWhereInput
  ): [User!]!
  referredBy(where: UserWhereInput): User
  referredByCode(where: ReferralCodeWhereInput): ReferralCode
  referredByCodeId: Int
  referredById: Int
  updatedAt: DateTimeISO!
}

type UserCount {
  referrals(where: UserWhereInput): Int!
}

input UserListRelationFilter {
  every: UserWhereInput
  none: UserWhereInput
  some: UserWhereInput
}

input UserNullableRelationFilter {
  is: UserWhereInput
  isNot: UserWhereInput
}

input UserOrderByRelationAggregateInput {
  _count: SortOrder
}

input UserOrderByWithRelationInput {
  address: SortOrder
  createdAt: SortOrder
  id: SortOrder
  maxReferrals: SortOrder
  refCodeHash: SortOrderInput
  referrals: UserOrderByRelationAggregateInput
  referredBy: UserOrderByWithRelationInput
  referredByCode: ReferralCodeOrderByWithRelationInput
  referredByCodeId: SortOrderInput
  referredById: SortOrderInput
  updatedAt: SortOrder
}

enum UserScalarFieldEnum {
  address
  createdAt
  id
  maxReferrals
  refCodeHash
  referredByCodeId
  referredById
  updatedAt
}

input UserWhereInput {
  AND: [UserWhereInput!]
  NOT: [UserWhereInput!]
  OR: [UserWhereInput!]
  address: StringFilter
  createdAt: DateTimeFilter
  id: IntFilter
  maxReferrals: IntFilter
  refCodeHash: StringNullableFilter
  referrals: UserListRelationFilter
  referredBy: UserNullableRelationFilter
  referredByCode: ReferralCodeNullableRelationFilter
  referredByCodeId: IntNullableFilter
  referredById: IntNullableFilter
  updatedAt: DateTimeFilter
}

input UserWhereUniqueInput {
  AND: [UserWhereInput!]
  NOT: [UserWhereInput!]
  OR: [UserWhereInput!]
  address: String
  createdAt: DateTimeFilter
  id: Int
  maxReferrals: IntFilter
  refCodeHash: String
  referrals: UserListRelationFilter
  referredBy: UserNullableRelationFilter
  referredByCode: ReferralCodeNullableRelationFilter
  referredByCodeId: IntNullableFilter
  referredById: IntNullableFilter
  updatedAt: DateTimeFilter
}

"""
Time window for volume-based sorting
"""
enum VolumeWindow {
  fourHours
  fourHoursFiltered
  oneHour
  oneHourFiltered
  sevenDays
  sevenDaysFiltered
  twentyFourHours
  twentyFourHoursFiltered
}
