"""
Time interval for bucketing the legacy per-account time-series resolvers.
"""
enum TimeInterval {
  DAY
  HOUR
  MONTH
  WEEK
}

"""
Time-bucketed collateral-balance data point (legacy).
"""
type BalanceDataPoint {
  """
  Collateral available to claim from settled positions (wei)
  """
  claimableCollateral: String!

  """
  Active collateral deployed in open positions (wei)
  """
  deployedCollateral: String!

  """
  Unix epoch timestamp (seconds) for the start of this bucket
  """
  timestamp: Int!
}

"""
Time-bucketed PnL data point with cumulative tracking (legacy).
"""
type PnlDataPoint {
  """
  Running cumulative PnL in wei
  """
  cumulativePnl: String!

  """
  PnL for this bucket in wei
  """
  pnl: String!

  """
  Unix epoch timestamp (seconds) for the start of this bucket
  """
  timestamp: Int!
}

"""
Time-bucketed prediction-count data point with outcome breakdown (legacy).
"""
type PredictionCountDataPoint {
  """
  Predictions lost in this bucket
  """
  lost: Int!

  """
  Predictions settled as non-decisive in this bucket
  """
  nonDecisive: Int!

  """
  Predictions still pending in this bucket
  """
  pending: Int!

  """
  Unix epoch timestamp (seconds) for the start of this bucket
  """
  timestamp: Int!

  """
  Total predictions opened in this bucket
  """
  total: Int!

  """
  Predictions won in this bucket
  """
  won: Int!
}

"""
Time-bucketed volume data point for charts (legacy).
"""
type VolumeDataPoint {
  """
  Unix epoch timestamp (seconds) for the start of this bucket
  """
  timestamp: Int!

  """
  Total volume in wei for this bucket
  """
  volume: String!
}

enum QueryMode {
  default
  insensitive
}

"""
A question item — either a group of related conditions or a single ungrouped condition
"""
type Question {
  condition: Condition
  group: ConditionGroup
  predictionCount: Int
  questionType: QuestionItemType!
}

"""
Whether a question is a group of related conditions or a single condition
"""
enum QuestionItemType {
  condition
  group
}

"""
Field to sort questions by
"""
enum QuestionSortField {
  createdAt
  endTime
  openInterest
  predictionCount
  similarMarketVolume
}

"""
Public referral code metadata and analytics. This intentionally includes creator,
claim counts, aggregate volume/position stats, and claimant breakdowns.

Referral codes are low-security attribution hints: using someone else's code only
credits that referrer; it does not grant access to funds or privileged actions.

`codeHash` is intentionally omitted from GraphQL because public clients should
not need it, and referral-code identity in this API is the integer `id`.
Credentialed create/update REST paths may still return hashes to the caller that
created or administers the code.
"""
type ReferralCode {
  id: Int!
  createdAt: DateTimeISO!
  updatedAt: DateTimeISO!
  createdBy: String!
  creatorType: String!
  maxClaims: Int!
  isActive: Boolean!
  expiresAt: Int

  """
  Total number of users who have claimed this code, across all pages.
  """
  claimCount: Int!

  """
  Sum of trading volume across every claimant's positions (predictor +
  counterparty sides), as a stringified bigint. Aggregated server-side.
  """
  totalVolume: String!

  """
  Total position count across every claimant. A position with both predictor
  and counterparty in the claimant set is counted twice, matching the
  per-side semantics.
  """
  totalPositions: Int!

  """
  Paginated per-claimant breakdown with trading volume + position count.
  """
  claimants(limit: Int = 100, cursor: Int): ReferralCodeClaimantsPage!
}

type ReferralCodesPage {
  items: [ReferralCode!]!
  nextCursor: Int
}

type ReferralCodeClaimantsPage {
  items: [ReferralCodeClaimant!]!
  nextCursor: Int
}

type ReferralCodeClaimant {
  id: Int!
  address: String!
  claimedAt: DateTimeISO!
  tradingVolume: String!
  positionCount: Int!
}

