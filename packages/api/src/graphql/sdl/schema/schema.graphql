# -----------------------------------------------
# Hand-written SDL — the source of truth for the API's GraphQL schema.
# Seeded from type-graphql output during the SDL-first migration; the
# header is preserved for historical context, but this file IS edited
# directly. The generated counterpart is `packages/api/schema.graphql`
# at the package root, emitted by `buildApiSchema` for client codegen.
#
# -----------------------------------------------
# Wire-format conventions (apply across every type in this file)
# -----------------------------------------------
#
#   Amounts (collateral, balances, payouts, PnL, volume):
#     `String` carrying a base-10 integer in wei. Sapience's collateral
#     token is wUSDe, 18 decimals — divide by 1e18 to render. Negative
#     amounts are allowed where it makes sense (`losses`, `cumulativePnL`).
#
#   Addresses:
#     `String` carrying a 0x-prefixed lowercase 20-byte hex address. The
#     indexer normalizes everything to lowercase; filter args accept
#     mixed-case and lowercase them server-side.
#
#   Hashes / token ids:
#     `String` carrying a 0x-prefixed lowercase 32-byte hex value.
#
#   Timestamps:
#     - `UnixSeconds` — integer epoch seconds. Used for on-chain
#       timestamps (event times, deadlines, attestation times).
#     - `DateTimeISO` — ISO 8601 string. Used for Postgres-managed
#       timestamps (`createdAt`, `updatedAt`, snapshot row boundaries).
#
#   IDs:
#     - `Int!` ids (`id` fields on Prisma-backed types) are internal row
#       ids — stable per row, not stable across deployments / re-indexes.
#       Use type-specific public identifiers when persisting client
#       state: `predictionId` (on-chain), `tradeHash` (on-chain),
#       `pickConfigId` (deterministic 0x-hash), condition `id` (chain
#       :: market :: question hash).
# -----------------------------------------------

"""
Accuracy rank and lifetime score for a single address. Mirrors
`AccountStatsRank`'s shape (`address`, the metric (`accuracyScore`),
`rank` 1-indexed and null when unranked) plus `totalForecasters` — the
size of the scored-forecaster set. Named specifically vs the generic
`AccountStatsRank.totalParticipants` because this surface only ranks
forecasters; accuracy is lifetime-aggregated (the time-weighted error
already weights by recency) so there's no window filter.
"""
type AccountAccuracyRank {
  address: Address!
  accuracyScore: Float!
  rank: Int
  totalForecasters: Int!
}

"""
DEPRECATED — kept only as the return type of `accountAccuracy`, which is
itself `@deprecated`. The leaderboard-row shape lives on
`AccountAccuracyLeaderboardEntry` (address + accuracyScore); the legacy aggregation
counters (`numScored`, `numTimeWeighted`, `sumErrorSquared`,
`sumTimeWeightedError`) were always returned as zeros from the resolver
even on main, so callers should treat them as non-load-bearing.
"""
type ForecasterScore {
  accuracyScore: Float!
  address: String!
  numScored: Int!
  numTimeWeighted: Int!
  sumErrorSquared: Float!
  sumTimeWeightedError: Float!
}

"""
DEPRECATED — kept only as the return type of `accountProfitRank`, which is
itself `@deprecated`. The replacement `AccountStatsRank` carries the same
rank / totalParticipants plus a richer per-metric stat breakdown
(`netPnL` / `gains` / `losses` / `volume`); `totalPnL` here maps to
`AccountStatsRank.netPnL`.
"""
type ProfitRank {
  address: String!
  rank: Int
  totalParticipants: Int!
  totalPnL: String!
}

"""
Address-keyed account record. The thin replacement for the Prisma-leaked
`User` type — exposes only the fields the public API actually needs (today,
that's referral-graph data). When address-keyed metadata that doesn't fit
elsewhere shows up (display name, avatar, settings), it can grow here
without renaming.
"""
type Account implements Node {
  id: ID!
  """
  Canonical Ethereum wallet address.
  """
  address: Address!

  """
  When this account first appeared in the database.
  """
  createdAt: DateTimeISO!

  """
  keccak256(utf8(trimmed_lowercase_code)) of the user's referral code, if
  they own one. 0x-prefixed hex.
  """
  refCodeHash: String

  """
  Maximum number of referrals this account's code allows. Default is 0,
  so codes are not usable until explicitly configured.
  """
  maxReferrals: Int!

  """
  The account that referred this one (via their referral code), if any.
  """
  referredBy: Account

  """
  The referral code this account was referred by, if any.
  """
  referredByCode: ReferralCode

  """
  Accounts referred by this account (via this account's referral code).
  """
  referrals: [Account!]!

  stats(
    first: Int = 50
    after: String
    filter: AccountStatFilter
    orderBy: AccountStatOrder
  ): AccountStatConnection!
  rank(metric: LeaderboardMetric!, filter: AccountRankingFilter): AccountRanking
  predictions(
    first: Int = 50
    after: String
    filter: PredictionFilter
    orderBy: PredictionOrder
  ): PredictionConnection!
  trades(
    first: Int = 50
    after: String
    filter: TradeFilter
    orderBy: TradeOrder
  ): TradeConnection!
  forecasts(
    first: Int = 50
    after: String
    filter: ForecastFilter
    orderBy: ForecastOrder
  ): ForecastConnection!
  positions(
    first: Int = 50
    after: String
    filter: PositionFilter
    orderBy: PositionOrder
  ): PositionConnection!
  collateralBalance(chainId: Int!, atBlock: BigInt): CollateralBalance!
}

"""
A single activity entry — either a prediction or a trade, sorted by timestamp
"""
type ActivityItem {
  prediction: Prediction

  """
  Unix seconds timestamp for sorting.
  """
  timestamp: UnixSeconds!
  trade: ActivityTrade
  # Wire values are the lowercase enum names ("prediction" / "trade"). Kept as
  # `String!` (not `ActivityItemType!`) because this field is reachable from
  # the deprecated `accountActivity` path; tightening it to the enum would
  # break typed clients without a wire-format change.
  type: String!
}

"""
Discriminator for which side of `ActivityItem` is populated. Wire values
are lowercase to preserve compatibility with the deprecated `accountActivity`
path that shipped before the enum tightening.
"""
enum ActivityItemType {
  prediction
  trade
}

"""
Trade fields embedded in an activity item
"""
type ActivityTrade {
  blockNumber: Int!
  buyer: String!
  chainId: Int!
  collateral: String!
  executedAt: UnixSeconds!
  id: Int!
  pickConfig: PickConfiguration
  price: String!
  seller: String!
  token: String!
  tokenAmount: String!
  tradeHash: String!
  txHash: String!
}

"""
Public Forecast surface backed by EAS attestation rows.

TODO(node-migration): Should `implements Node` with `id: ID!`. Currently
exposes `id: Int!` (Prisma row id), so the wire format would change from
number → opaque string — a breaking change for typed clients. Plan: add
`globalId: ID!` alongside, deprecate the raw integer read, flip on a
future major.
"""
type Forecast {
  forecastScore(where: ForecastScoreWhereInput): ForecastScore
  forecaster: String!
  blockNumber: Int!
  comment: String
  condition(where: ConditionWhereInput): Condition
  conditionId: String
  createdAt: DateTimeISO!
  data: String!
  decodedDataJson: String!
  id: Int!

  """
  Raw forecast value as recorded on-chain — the `uint256 forecast` field
  on the EAS attestation schema, returned as a decimal string in D18
  fixed-point representing a probability in `[0, 1e18]`. For the
  canonical normalized probability use `Forecast.forecastScore.probabilityFloat`
  (0–1 float) or `Forecast.forecastScore.probabilityD18`
  (18-decimal fixed-point string).
  """
  forecast: String!
  recipient: String!

  """
  Resolver contract address from the on-chain EAS attestation (`address resolver`
  on the forecast schema). Identifies which oracle the forecaster is predicting
  against — same address as `Condition.resolverAddress` when the forecast
  matches a tracked condition.
  """
  resolverAddress: Address
  schemaId: String!

  """
  When the forecast was made on-chain.
  """
  attestedAt: UnixSeconds!
  transactionHash: String!
  uid: String!
}

input ForecastListRelationFilter {
  every: ForecastWhereInput
  none: ForecastWhereInput
  some: ForecastWhereInput
}

input ForecastOrderByRelationAggregateInput {
  _count: SortOrder
}

input ForecastRelationFilter {
  is: ForecastWhereInput
  isNot: ForecastWhereInput
}

type ForecastScore {
  forecast: Forecast!
  forecastId: Int!
  forecaster: String!
  createdAt: DateTimeISO!
  errorSquared: Float
  id: Int!
  madeAt: UnixSeconds!

  """
  Resolver contract address this score is keyed against. Mirrors
  `Condition.resolverAddress` for the scored forecast. The DB row carries two
  legacy columns (`marketAddress`, `resolver`) that hold the same value; the
  GraphQL surface exposes the single corrected name.
  """
  resolverAddress: Address
  marketId: String
  outcome: Int
  probabilityD18: String
  probabilityFloat: Float
  questionId: String
  scoredAt: DateTimeISO
  used: Boolean!
}

input ForecastScoreNullableRelationFilter {
  is: ForecastScoreWhereInput
  isNot: ForecastScoreWhereInput
}

input ForecastScoreWhereInput {
  AND: [ForecastScoreWhereInput!]
  NOT: [ForecastScoreWhereInput!]
  OR: [ForecastScoreWhereInput!]
  forecast: ForecastRelationFilter
  forecastId: IntFilter
  forecaster: StringFilter
  createdAt: DateTimeFilter
  errorSquared: FloatNullableFilter
  id: IntFilter
  madeAt: IntFilter
  marketAddress: StringNullableFilter
  marketId: StringNullableFilter
  outcome: IntNullableFilter
  probabilityD18: StringNullableFilter
  probabilityFloat: FloatNullableFilter
  questionId: StringNullableFilter
  resolver: StringNullableFilter
  scoredAt: DateTimeNullableFilter
  used: BoolFilter
}

input ForecastWhereInput {
  AND: [ForecastWhereInput!]
  NOT: [ForecastWhereInput!]
  OR: [ForecastWhereInput!]
  forecastScore: ForecastScoreNullableRelationFilter
  forecaster: StringFilter
  blockNumber: IntFilter
  comment: StringNullableFilter
  condition: ConditionNullableRelationFilter
  conditionId: StringNullableFilter
  createdAt: DateTimeFilter
  data: StringFilter
  decodedDataJson: StringFilter
  id: IntFilter
  forecast: StringFilter
  recipient: StringFilter
  resolver: StringNullableFilter
  schemaId: StringFilter
  attestedAt: IntFilter
  transactionHash: StringFilter
  uid: StringFilter
}

"""
0x-prefixed lowercase 20-byte hex address. Server-side parsing is
case-insensitive (mixed-case checksums are accepted on input and
normalized to lowercase); serialization always emits lowercase.
"""
scalar Address

"""
The `BigInt` scalar type represents non-fractional signed whole numeric values.
"""
scalar BigInt

"""
0x-prefixed lowercase 32-byte hex value. Used for transaction hashes,
EAS attestation UIDs, and other 32-byte on-chain identifiers. Case-
insensitive on input; serializes lowercase.
"""
scalar Bytes32

input BigIntFilter {
  equals: BigInt
  gt: BigInt
  gte: BigInt
  in: [BigInt!]
  lt: BigInt
  lte: BigInt
  not: NestedBigIntFilter
  notIn: [BigInt!]
}

# --- Operator-pattern filters (new convention per redesign doc) ---
# These match the doc's "One filter convention, one sort convention"
# section: each operator (`equals`, `in`, `not`, `isNull`) is a flat
# field. Distinct from the legacy Prisma-style `not: Nested<X>Filter`
# inputs above. New filter inputs (`ConditionFilter`, `QuestionFilter`,
# etc.) reference these; legacy Prisma-style filters remain on
# pre-existing `*Page` paths during the deprecation window.

"""
Operator-pattern filter for `ID` scalar fields. Supports equality,
membership, negation, and null. Resolvers reject unsupported operators
on a per-field basis (e.g., a non-nullable column rejects `isNull`).
"""
input IDFilter {
  equals: ID
  in: [ID!]
  notIn: [ID!]
  not: ID
  isNull: Boolean
}

"""
Operator-pattern filter for `ConditionOutcome` enum. `{ isNull: true }`
selects unsettled conditions; `{ isNull: false }` selects settled
(any outcome). `{ equals: NON_DECISIVE }` selects voided/non-decisive
settlements specifically. See `ConditionOutcome`.
"""
input ConditionOutcomeFilter {
  equals: ConditionOutcome
  in: [ConditionOutcome!]
  notIn: [ConditionOutcome!]
  not: ConditionOutcome
  isNull: Boolean
}

input BoolFilter {
  equals: Boolean
  not: NestedBoolFilter
}

input BoolNullableFilter {
  equals: Boolean
  not: NestedBoolNullableFilter
}

type Category implements Node {
  _count: CategoryCount
  conditionGroups(
    cursor: ConditionGroupWhereUniqueInput
    distinct: [ConditionGroupScalarFieldEnum!]
    orderBy: [ConditionGroupOrderByWithRelationInput!]
    skip: Int
    take: Int
    where: ConditionGroupWhereInput
  ): [ConditionGroup!]!
  conditions(
    cursor: ConditionWhereUniqueInput
    distinct: [ConditionScalarFieldEnum!]
    orderBy: [ConditionOrderByWithRelationInput!]
    skip: Int
    take: Int
    where: ConditionWhereInput
  ): [Condition!]!
  createdAt: DateTimeISO!
  id: ID!
  name: String!
  slug: String
}

type CategoryCount {
  condition(where: ConditionWhereInput): Int!
  condition_group(where: ConditionGroupWhereInput): Int!
}

input CategoryNullableRelationFilter {
  is: CategoryWhereInput
  isNot: CategoryWhereInput
}

input CategoryOrderByWithRelationInput {
  conditionGroups: ConditionGroupOrderByRelationAggregateInput
  conditions: ConditionOrderByRelationAggregateInput
  createdAt: SortOrder
  id: SortOrder
  name: SortOrder
  slug: SortOrder
}

enum CategoryScalarFieldEnum {
  createdAt
  id
  name
  slug
}

input CategoryWhereInput {
  AND: [CategoryWhereInput!]
  NOT: [CategoryWhereInput!]
  OR: [CategoryWhereInput!]
  conditionGroups: ConditionGroupListRelationFilter
  conditions: ConditionListRelationFilter
  createdAt: DateTimeFilter
  id: IntFilter
  name: StringFilter
  slug: StringFilter
}

input CategoryWhereUniqueInput {
  AND: [CategoryWhereInput!]
  NOT: [CategoryWhereInput!]
  OR: [CategoryWhereInput!]
  conditionGroups: ConditionGroupListRelationFilter
  conditions: ConditionListRelationFilter
  createdAt: DateTimeFilter
  id: Int
  name: StringFilter
  slug: String
}

"""
Record of a settled prediction redemption where a holder burns tokens for collateral
"""
type Claim {
  chainId: Int!
  collateralPaid: String!
  holder: Address!
  id: Int!
  marketAddress: Address!
  positionToken: Address!
  predictionId: String!
  redeemedAt: UnixSeconds!
  refCode: String
  tokensBurned: String!
  txHash: String!
}

"""
Record of a position close where both sides burn tokens and receive payouts
"""
type Close {
  burnedAt: UnixSeconds!
  chainId: Int!
  counterpartyHolder: Address!
  counterpartyPayout: String!
  counterpartyTokensBurned: String!
  id: Int!
  marketAddress: Address!
  pickConfigId: String!
  predictorHolder: Address!
  predictorPayout: String!
  predictorTokensBurned: String!
  refCode: String
  txHash: String!
}

type Activity {
  source: ActivitySource!
  account: Account!
  createdAt: DateTimeISO!
}

union ActivitySource = Prediction | Trade

enum ActivityType {
  PREDICTION
  TRADE
}

type ActivityConnection {
  edges: [ActivityEdge!]!
  nodes: [Activity!]!
  pageInfo: PageInfo!
  """
  Sum of matching Prediction and SecondaryTrade rows for the same filters
  the page was sliced from. Resolved lazily via two indexed `COUNT(*)`
  queries only when clients select this field.
  """
  totalCount: Int!
}

type ActivityEdge {
  node: Activity!
  cursor: String!
}

enum ActivityOrderField {
  CREATED_AT
}

input ActivityOrder {
  field: ActivityOrderField!
  direction: OrderDirection!
}

"""
Filter input for the Relay-shaped `activity(...)` connection. Combines
with AND. `types: []` is an explicit zero-result query — omit `types`
to include both predictions and trades.
"""
input ActivityFilter {
  """
  Restrict to a single account's activity (case-insensitive). OR-across
  prediction roles (predictor / counterparty) and trade sides (buyer /
  seller). Omit for a global feed.
  """
  account: String
  """
  Restrict to activity on a single condition. Walks Pick → PickConfiguration
  to derive the matching pickConfigIds (predictions) and predictor /
  counterparty tokens (trades).
  """
  conditionId: String
  """
  Restrict to activity on any of these conditions. Union with `conditionId`
  when both are supplied; useful for group-backed feeds where the caller
  has the condition list pre-resolved.
  """
  conditionIds: [String!]
  """
  Restrict to activity reachable through a ConditionGroup's member conditions.
  Expanded server-side into the group's condition ids, then treated as
  `conditionIds`.
  """
  conditionGroupId: Int
  """
  Restrict to activity tied to a single pick configuration. When combined
  with `conditionId`/`conditionIds`, intersects with that condition's
  pickConfig set.
  """
  pickConfigId: String
  """
  Restrict to one or both ActivityType union members. `[]` is an explicit
  zero-result query.
  """
  types: [ActivityType!]
  """
  Filter by activity row creation epoch seconds, e.g. `{ gte: 1770000000 }`.
  Applied as `createdAt` on Predictions (Postgres timestamp) and
  `executedAt` on Trades (Int seconds) — bounds project to each side's
  native column type.
  """
  createdAt: IntFilter
}

enum LeaderboardMetric {
  ACCURACY
  PNL
  VOLUME
  ROI
}

"""
Filter input for the `AccountRankingConnection` returned by
`leaderboard(...)`. PNL / VOLUME / ROI aggregate over a configurable
window; ACCURACY is lifetime-aggregated (the time-weighted Brier-derived
score already weights by recency) and ignores the window. Operator-
pattern shape matches `AccountStatFilter`.
"""
input AccountRankingFilter {
  """
  Filter by aggregation epoch seconds. `{ gte }` sets the window's lower
  bound, `{ lte }` sets the upper bound; both inclusive. Other operators
  reject — this is a window selector, not a point query.
  """
  timestamp: IntFilter
}

input AccountStatFilter {
  timestamp: IntFilter
}

input AccountStatOrder {
  field: AccountStatOrderField!
  direction: OrderDirection!
}

enum AccountStatOrderField {
  TIMESTAMP
}

type AccountRanking {
  account: Account!
  rank: Int!
  value: String!
}

type AccountRankingConnection {
  edges: [AccountRankingEdge!]!
  nodes: [AccountRanking!]!
  pageInfo: PageInfo!
  """
  Size of the underlying ranked set the page is sliced from. Already
  computed in memory (the leaderboard materializes the full ranking),
  so cheap to surface.
  """
  totalCount: Int!
  metric: LeaderboardMetric!
}

type AccountRankingEdge {
  node: AccountRanking!
  cursor: String!
}

type AccountStatConnection {
  edges: [AccountStatEdge!]!
  nodes: [AccountStat!]!
  pageInfo: PageInfo!
  """
  Size of the full time-series rendered by this query (pre-pagination).
  Already known in memory — the resolver materializes every bucket
  before slicing — so cheap to surface.
  """
  totalCount: Int!
}

type AccountStatEdge {
  node: AccountStat!
  cursor: String!
}

type CollateralToken {
  symbol: String!
  address: Address!
  decimals: Int!
  chainId: Int!
}

type CollateralBalanceSnapshot {
  account: Account!
  chainId: Int!
  collateral: CollateralToken!
  amount: String!
  blockNumber: BigInt!
  timestamp: DateTimeISO!
  """
  Position of this snapshot in the returned series, starting at 0 for the
  most-recent boundary. Carried over from the legacy `CollateralBalanceSnapshotType`.
  """
  index: Int!
    @deprecated(
      reason: "Index is incidental to the returned list order; rely on `timestamp` (or array position) instead."
    )
  """
  Same value as `amount`. Carried over from the legacy `CollateralBalanceSnapshotType`.
  """
  balance: String!
    @deprecated(
      reason: "Use `amount` — same value, drops the wallet-balance framing for consistency with `CollateralTransfer.amount`."
    )
}

type CollateralBalance {
  account: Account!
  chainId: Int!
  collateral: CollateralToken!
  amount: String!
  atBlock: Int
  address: Address!
  balance: String!
}

type CollateralTransfer implements Node {
  id: ID!
  account: Account!
  chainId: Int!
  collateral: CollateralToken!
  amount: String!
  transactionHash: Bytes32!
  createdAt: DateTimeISO!
  blockNumber: Int!
  from: String!
  timestamp: DateTimeISO!
  to: String!
  value: String!
  logIndex: Int!
}

type Condition implements Node {
  _count: ConditionCount
  assertionId: String
  assertionTimestamp: UnixSeconds
  category(where: CategoryWhereInput): Category
  categoryId: Int
  chainId: Int!
  conditionGroup(where: ConditionGroupWhereInput): ConditionGroup
  conditionGroupId: Int
  createdAt: DateTimeISO!
  description: String!
  displayOrder: Int
  endTime: UnixSeconds!

  """
  YES probability from Polymarket (0.0–1.0), null for non-Polymarket
  """
  estimatedPrice: Float
  """
  Opaque global ID for Relay-style `node(id:)` refetch. Use `conditionId`
  for the on-chain condition identifier.
  """
  id: ID!
  """
  Natural-key condition id (on-chain identifier), returned verbatim.
  """
  conditionId: String!
  nonDecisive: Boolean!
  openInterest: String!
  optionName: String

  """
  Resolution state of this condition. `null` until the on-chain resolver
  returns; once settled, carries the resolved value (`YES` / `NO` for
  decisive outcomes, `NON_DECISIVE` for voids / ties). Filter "settled
  vs unsettled" via `outcome: { isNull: ... }` rather than relying on
  the deprecated `settled: Boolean!` field.
  """
  outcome: ConditionOutcome

  predictionCount: Int!
  """
  Note: this field will be renamed to drop the `Connection` suffix
  (→ `predictions`) in a subsequent migration.
  """
  predictionsConnection(
    first: Int = 50
    after: String
    filter: PredictionFilter
    orderBy: PredictionOrder
  ): PredictionConnection!
  trades(
    first: Int = 50
    after: String
    filter: TradeFilter
    orderBy: TradeOrder
  ): TradeConnection!
  forecasts(
    first: Int = 50
    after: String
    filter: ForecastFilter
    orderBy: ForecastOrder
  ): ForecastConnection!
  public: Boolean!
  question: String!
  resolvedToYes: Boolean!

  """
  Resolver contract address — the oracle that settles this condition's outcome.
  Distinct from the PredictionMarketEscrow address (which is `Prediction.marketAddress` /
  `PickConfiguration.marketAddress`); one resolver contract can settle conditions
  referenced by many escrow markets.
  """
  resolverAddress: Address!

  """
  Mislabeled alias of `resolverAddress`. Holds the resolver contract address,
  not the PredictionMarketEscrow address. The recent `resolver → marketAddress`
  migration collapsed a real distinction; `resolverAddress` is the corrected name.
  """
  marketAddress: Address!
    @deprecated(
      reason: "Use `resolverAddress` — same value, but accurately named. This field holds the resolver (oracle) contract address, not the market/escrow address that `Prediction.marketAddress` / `PickConfiguration.marketAddress` carry."
    )

  """
  Canonical resolver address for this condition (required).
  """
  resolver: String!
    @deprecated(
      reason: "Use `resolverAddress` — same value, Address-typed and consistent with `Forecast.resolverAddress` / `Pick.conditionResolverAddress`."
    )
  settled: Boolean!
  settledAt: UnixSeconds
  shortName: String

  """
  Image URL from Polymarket similar market
  """
  similarMarketImage: String

  """
  USD total trading volume from Polymarket similar market
  """
  similarMarketVolume: Float!
  similarMarketVolume1h: Float!
  similarMarketVolume4h: Float!
  similarMarketVolume7d: Float!
  similarMarketVolume24h: Float!
  similarMarketVolumeFiltered1h: Float!
  similarMarketVolumeFiltered4h: Float!
  similarMarketVolumeFiltered7d: Float!
  similarMarketVolumeFiltered24h: Float!
  similarMarkets: [String!]!
  tags: [String!]!
}

type ConditionCount {
  forecasts(where: ForecastWhereInput): Int!
}

"""
Resolved state of a `Condition`. `YES` and `NO` are decisive resolutions
of the binary outcome; `NON_DECISIVE` covers voided / tied / unresolvable
settlements (which the protocol collapses to `COUNTERPARTY_WINS` at the
Prediction layer). Nullable on the wire — `null` means "not yet settled."

Derived at the resolver from `settled` / `resolvedToYes` / `nonDecisive`
columns; clients should filter "settled" via `outcome: { isNull: false }`
rather than depending on the legacy boolean fields.
"""
enum ConditionOutcome {
  YES
  NO
  NON_DECISIVE
}

"""
TODO(node-migration): Should `implements Node` with `id: ID!`. Currently
exposes `id: Int!` (Prisma row id), so the wire format would change from
number → opaque string — a breaking change for typed clients. Plan: add
`globalId: ID!` alongside, deprecate the raw integer read, flip on a
future major.
"""
type ConditionGroup {
  _count: ConditionGroupCount
  category(where: CategoryWhereInput): Category
  categoryId: Int
  conditions(
    cursor: ConditionWhereUniqueInput
    distinct: [ConditionScalarFieldEnum!]
    orderBy: [ConditionOrderByWithRelationInput!]
    skip: Int
    take: Int
    where: ConditionWhereInput
  ): [Condition!]!
  createdAt: DateTimeISO!
  id: Int!
  name: String!
  similarMarkets: [String!]!
  """
  Compatibility alias mirroring `name`. Kept so external clients still
  selecting `ConditionGroup.title` keep working through one release.
  """
  title: String!
    @deprecated(
      reason: "Use `name` — same value, the alias exists only to absorb in-flight queries from older clients."
    )
}

type ConditionGroupCount {
  condition(where: ConditionWhereInput): Int!
}

input ConditionGroupListRelationFilter {
