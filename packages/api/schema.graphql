type Query {
  accuracyRankByAddress(attester: String!): AccuracyRankType!
  allTimeProfitLeaderboard: [AggregatedProfitEntryType!]!
  attestations(cursor: AttestationWhereUniqueInput, distinct: [AttestationScalarFieldEnum!], orderBy: [AttestationOrderByWithRelationInput!], skip: Int, take: Int, where: AttestationWhereInput): [Attestation!]!
  categories(cursor: CategoryWhereUniqueInput, distinct: [CategoryScalarFieldEnum!], orderBy: [CategoryOrderByWithRelationInput!], skip: Int, take: Int, where: CategoryWhereInput): [Category!]!
  claims(chainId: Int, holder: String, predictionId: String, skip: Int! = 0, take: Int! = 50): [ClaimType!]!
  closes(address: String, chainId: Int, pickConfigId: String, skip: Int! = 0, take: Int! = 50): [CloseType!]!
  condition(where: ConditionWhereUniqueInput!): Condition
  conditionGroup(where: ConditionGroupWhereUniqueInput!): ConditionGroup
  conditionGroups(cursor: ConditionGroupWhereUniqueInput, distinct: [ConditionGroupScalarFieldEnum!], orderBy: [ConditionGroupOrderByWithRelationInput!], skip: Int, take: Int, where: ConditionGroupWhereInput): [ConditionGroup!]!
  conditions(cursor: ConditionWhereUniqueInput, distinct: [ConditionScalarFieldEnum!], orderBy: [ConditionOrderByWithRelationInput!], skip: Int, take: Int, where: ConditionWhereInput): [Condition!]!
  dailyVolumes: [DailyVolume!]!
  forecasterScore(attester: String!): ForecasterScoreType
  legacyPositions(address: String, chainId: Int, endsAtGte: Int, marketAddress: String, nftTokenId: String, orderBy: String, orderDirection: String, skip: Int! = 0, status: String, take: Int! = 50): [LegacyPositionType!]!
  legacyPositionsByConditionId(chainId: Int, conditionId: String!, endsAtGte: Int, skip: Int! = 0, status: String, take: Int! = 100): [LegacyPositionType!]!
  legacyPositionsCount(address: String!, chainId: Int): Int!
  pickConfiguration(id: String!): PicksType
  pickConfigurations(chainId: Int, resolved: Boolean, result: String, skip: Int! = 0, take: Int! = 50): [PicksType!]!
  positions(chainId: Int, holder: String!, pickConfigId: String, skip: Int! = 0, take: Int! = 50): [PositionType!]!
  prediction(predictionId: String!): PredictionType
  predictions(address: String, chainId: Int, orderBy: String, orderDirection: String, settled: Boolean, skip: Int! = 0, take: Int! = 50): [PredictionType!]!
  predictionsCount(address: String!, chainId: Int): Int!
  profitRankByAddress(owner: String!): ProfitRankType!
  protocolStats: [ProtocolStat!]!
  questionsSorted(categorySlugs: [String!], chainId: Int, minEndTime: Int, resolutionStatus: String, search: String, skip: Int!, sortDirection: String!, sortField: String, take: Int!): [Question!]!

  """
  Returns the most recently created legacy positions globally, ordered by mintedAt descending.
  """
  recentLegacyPositions(chainId: Int, skip: Int! = 0, status: String, take: Int! = 20): [LegacyPositionType!]!
  topForecasters(limit: Int! = 10): [ForecasterScoreType!]!
  tradingVolumeByAddress(address: String!): String!
  user(where: UserWhereUniqueInput!): User
  users(cursor: UserWhereUniqueInput, distinct: [UserScalarFieldEnum!], orderBy: [UserOrderByWithRelationInput!], skip: Int, take: Int, where: UserWhereInput): [User!]!
}

enum QueryMode {
  default
  insensitive
}

type Question {
  condition: Condition
  group: ConditionGroup
  predictionCount: Int
  questionType: String!
}

type ReferralCode {
  _count: ReferralCodeCount
  claimedBy(cursor: UserWhereUniqueInput, distinct: [UserScalarFieldEnum!], orderBy: [UserOrderByWithRelationInput!], skip: Int, take: Int, where: UserWhereInput): [User!]!
  codeHash: String!
  createdAt: DateTimeISO!
  createdBy: String!
  creatorType: String!
  expiresAt: Int
  id: Int!
  isActive: Boolean!
  maxClaims: Int!
  updatedAt: DateTimeISO!
}

type ReferralCodeCount {
  claimedBy(where: UserWhereInput): Int!
}

input ReferralCodeNullableRelationFilter {
  is: ReferralCodeWhereInput
  isNot: ReferralCodeWhereInput
}

input ReferralCodeOrderByWithRelationInput {
  claimedBy: UserOrderByRelationAggregateInput
  codeHash: SortOrder
  createdAt: SortOrder
  createdBy: SortOrder
  creatorType: SortOrder
  expiresAt: SortOrderInput
  id: SortOrder
  isActive: SortOrder
  maxClaims: SortOrder
  updatedAt: SortOrder
}

input ReferralCodeWhereInput {
  AND: [ReferralCodeWhereInput!]
  NOT: [ReferralCodeWhereInput!]
  OR: [ReferralCodeWhereInput!]
  claimedBy: UserListRelationFilter
  codeHash: StringFilter
  createdAt: DateTimeFilter
  createdBy: StringFilter
  creatorType: StringFilter
  expiresAt: IntNullableFilter
  id: IntFilter
  isActive: BoolFilter
  maxClaims: IntFilter
  updatedAt: DateTimeFilter
}

enum SortOrder {
  asc
  desc
}

input SortOrderInput {
  nulls: NullsOrder
  sort: SortOrder!
}

input StringFilter {
  contains: String
  endsWith: String
  equals: String
  gt: String
  gte: String
  in: [String!]
  lt: String
  lte: String
  mode: QueryMode
  not: NestedStringFilter
  notIn: [String!]
  startsWith: String
}

input StringNullableFilter {
  contains: String
  endsWith: String
  equals: String
  gt: String
  gte: String
  in: [String!]
  lt: String
  lte: String
  mode: QueryMode
  not: NestedStringNullableFilter
  notIn: [String!]
  startsWith: String
}

input StringNullableListFilter {
  equals: [String!]
  has: String
  hasEvery: [String!]
  hasSome: [String!]
  isEmpty: Boolean
}

"""
Application-level user record, keyed by wallet address,
used for referrals and other per-wallet metadata.
"""
type User {
  _count: UserCount

  """Canonical Ethereum wallet address for this user."""
  address: String!
  createdAt: DateTimeISO!
  id: Int!

  """
  Maximum number of referrals this user's code allows. Default is 0,
  so codes are not usable until explicitly configured.
  """
  maxReferrals: Int!

  """keccak256(utf8(trimmed_lowercase_code)) stored as 0x-prefixed hex."""
  refCodeHash: String
  referrals(cursor: UserWhereUniqueInput, distinct: [UserScalarFieldEnum!], orderBy: [UserOrderByWithRelationInput!], skip: Int, take: Int, where: UserWhereInput): [User!]!
  referredBy(where: UserWhereInput): User
  referredByCode(where: ReferralCodeWhereInput): ReferralCode
  referredByCodeId: Int
  referredById: Int
  updatedAt: DateTimeISO!
}

type UserCount {
  referrals(where: UserWhereInput): Int!
}

input UserListRelationFilter {
  every: UserWhereInput
  none: UserWhereInput
  some: UserWhereInput
}

input UserNullableRelationFilter {
  is: UserWhereInput
  isNot: UserWhereInput
}

input UserOrderByRelationAggregateInput {
  _count: SortOrder
}

input UserOrderByWithRelationInput {
  address: SortOrder
  createdAt: SortOrder
  id: SortOrder
  maxReferrals: SortOrder
  refCodeHash: SortOrderInput
  referrals: UserOrderByRelationAggregateInput
  referredBy: UserOrderByWithRelationInput
  referredByCode: ReferralCodeOrderByWithRelationInput
  referredByCodeId: SortOrderInput
  referredById: SortOrderInput
  updatedAt: SortOrder
}

enum UserScalarFieldEnum {
  address
  createdAt
  id
  maxReferrals
  refCodeHash
  referredByCodeId
  referredById
  updatedAt
}

input UserWhereInput {
  AND: [UserWhereInput!]
  NOT: [UserWhereInput!]
  OR: [UserWhereInput!]
  address: StringFilter
  createdAt: DateTimeFilter
  id: IntFilter
  maxReferrals: IntFilter
  refCodeHash: StringNullableFilter
  referrals: UserListRelationFilter
  referredBy: UserNullableRelationFilter
  referredByCode: ReferralCodeNullableRelationFilter
  referredByCodeId: IntNullableFilter
  referredById: IntNullableFilter
  updatedAt: DateTimeFilter
}

input UserWhereUniqueInput {
  AND: [UserWhereInput!]
  NOT: [UserWhereInput!]
  OR: [UserWhereInput!]
  address: String
  createdAt: DateTimeFilter
  id: Int
  maxReferrals: IntFilter
  refCodeHash: String
  referrals: UserListRelationFilter
  referredBy: UserNullableRelationFilter
  referredByCode: ReferralCodeNullableRelationFilter
  referredByCodeId: IntNullableFilter
  referredById: IntNullableFilter
  updatedAt: DateTimeFilter
}