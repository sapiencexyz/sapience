  totalSimilarMarketVolume24h: Float!
  totalSimilarMarketVolume7d: Float!
  totalSimilarMarketVolumeFiltered1h: Float!
  totalSimilarMarketVolumeFiltered4h: Float!
  totalSimilarMarketVolumeFiltered24h: Float!
