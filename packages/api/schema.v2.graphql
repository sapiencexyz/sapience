"""
0x-prefixed lowercase 20-byte Ethereum address. Mixed-case checksum input is accepted and normalized to lowercase.
"""
scalar Address

"""
Integer epoch seconds. Wire format is Int; the scalar carries the unit/TZ contract in the type system rather than the field name.
"""
scalar UnixSeconds

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTimeISO

"""
The `BigInt` scalar type represents non-fractional signed whole numeric values.
"""
scalar BigInt

"""
0x-prefixed lowercase 32-byte hex value. Used for transaction hashes, EAS UIDs, and other 32-byte on-chain identifiers.
"""
scalar Bytes32

"""
0x-prefixed lowercase hex of any byte length. Mixed-case input is accepted and normalized to lowercase.
"""
scalar Bytes

"""
Relay `Node` interface — every persistent entity in v2 implements it.
The `id` is an opaque base64url-encoded `(TypeName, domainId)` pair;
clients should treat it as a refetch handle and read the entity's named
domain identifier (`address`, `predictionId`, `tradeHash`, …) for any
display or persistence use.
"""
interface Node {
  id: ID!
}

"""
Anything addressable on-chain. Both wallet-keyed accounts and
contract-controlled vaults expose an `address` and a Node identity, so
v2 unifies them under one interface.

The interface is intentionally narrow: `id` + `address`. Account-scoped
analytics (`ranking`, `collateralBalance`, …) live on `Account`
directly rather than the interface, because the vault equivalents are
different metrics (a vault's balance is its on-chain `availableAssets` /
`deployed`, not a wallet transfer-sum). If a genuinely shared
address-scoped field emerges, promote it here then.
"""
interface AddressEntity implements Node {
  id: ID!
  address: Address!

  """
  Chain this address is scoped to. An on-chain address is only meaningful
  paired with its chain, so every address entity carries one.
  """
  chainId: Int!
}

"""Standard Relay pagination metadata."""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""Order direction shared across every `*Order` input."""
enum OrderDirection {
  ASC
  DESC
}

"""
Address-keyed account record — wallet-level identity. Synthesized for
addresses that have no User row so every valid address resolves to an
Account; persistent rows additionally carry referral metadata.
"""
type Account implements Node & AddressEntity {
  id: ID!

  """Canonical lowercase Ethereum wallet address."""
  address: Address!

  """
  Chain this account view is scoped to. Defaults to the deployment's chain
  when the account was resolved without an explicit `chainId`.
  """
  chainId: Int!

  """
  When this account first appeared in the database. Synthesized accounts return the unix epoch.
  """
  createdAt: DateTimeISO!

  """This account's ranking on a chosen metric, or `null` when unranked."""
  ranking(metric: LeaderboardMetric!, filter: RankingFilter): Ranking

  """
  Current wUSDe wallet balance at an optional block (defaults to head).
  Scoped to the account's `chainId`.
  """
  collateralBalance(atBlock: Int): CollateralBalance!

  """
  Time-bucketed wUSDe wallet balance snapshots, scoped to the account's
  `chainId`. Step size is `intervalSeconds` (default 7d); returns
  `first + 1` boundaries back from now.
  """
  collateralBalanceHistory(first: Int = 12, after: String, intervalSeconds: Int): CollateralBalanceConnection!

  """
  Aggregate statistics for this account. Cheap to resolve; always present.
  """
  stats: AccountStat!

  """
  Time-bucketed series of this account's prediction activity — deployed /
  claimable collateral, trade volume, settlement PnL (per-bucket and
  running), and prediction win / loss / pending / non-decisive counts.
  Computed live from escrow predictions, legacy positions, claims, closes,
  and secondary trades (no snapshot table), so — unlike the chain-scoped
  identity fields — the series spans the address across chains. Buckets are
  ordered oldest-first (ascending `timestamp`), ready to plot. `interval`
  sets the bucket size; `filter.timestamp` (epoch seconds, inclusive) bounds
  the window. With no filter the window defaults to the last 90 days, clamped
  to the interval's own cap so it never overflows — e.g. `HOUR` caps at 168
  buckets, so its default is the last 7 days (an explicit wider window is
  rejected). The defaulted window fits one page, so the default returns the
  whole series in one shot while still honouring `first` / `after`.
  """
  statsHistory(interval: TimeInterval!, first: Int = 366, after: String, filter: AccountStatFilter): AccountStatPointConnection!
}

"""
Aggregate statistics for an account. Volume-only today; extends with
realized PnL / accuracy if a full per-account PnL surface is built (see
the DEFERRED note on `Account`).
"""
type AccountStat {
  """Cumulative trade volume across all of this account's activity, wei."""
  totalVolume: BigInt!
}

"""
Bucketing granularity for `Account.statsHistory`. Unlike `Vault.statsHistory`
(a fixed daily snapshot cadence written by the stats worker), the account
series is computed live per request, so the caller picks the bucket size.
"""
enum TimeInterval {
  HOUR
  DAY
  WEEK
  MONTH
}

"""
One time bucket of an account's prediction activity. Amounts are wUSDe wei
and `timestamp` is the bucket's start (epoch seconds). The field vocabulary
deliberately mirrors `VaultStat` — `deployedCollateral`, `realizedPnl`,
`cumulativePnl` carry the same meaning at the account level. PnL is truncated
toward zero to integer wei (the proportional cost-basis math can produce
sub-wei fractions).
"""
type AccountStatPoint {
  timestamp: UnixSeconds!

  """
  Collateral staked in positions still open as of the bucket — created on or
  before the boundary and not yet settled. The deployed leg of the account's
  escrow balance; mirrors `VaultStat.deployedCollateral`.
  """
  deployedCollateral: BigInt!

  """
  Settled-and-won but not-yet-redeemed collateral owed to the account as of
  the bucket — the account analog of `VaultStat.claimableCollateral`.

  This is a *pending-balance* figure, deliberately NOT part of `cumulativePnl`
  (see there). It is attributed to the original position side and does not
  follow secondary-market transfers, so after a winning position token is sold
  pre-redemption it still reads against the seller until redeemed. Safe for the
  "pending claims" view; not used to realize PnL precisely for that reason.
  """
  claimableCollateral: BigInt!

  """
  Trade volume attributed to the bucket: predictor + counterparty stake on
  predictions created in-window, plus secondary-market trades.
  """
  volume: BigInt!

  """
  PnL realized within the bucket — the per-bucket increment of `cumulativePnl`
  (see there for exactly when PnL realizes): redemption gains on wins claimed
  in-window, losses/non-decisive at settlement, and secondary-market proceeds
  net of cost (`sold − bought`) on trades executed in-window. Same trading-PnL
  definition the vault plots, measured per-bucket.
  """
  realizedPnl: BigInt!

  """
  Running trading PnL through the end of the bucket: the cumulative sum of
  `realizedPnl`, seeded by all PnL realized *before* the window so the line
  never resets at the window start.

  PnL is realized only when a position is actually settled — a win at the
  moment it is *redeemed* (a claim), a loss/non-decisive at settlement, plus
  secondary-market proceeds and cost as they trade. It is NOT marked from
  still-unredeemed `claimableCollateral`. This is deliberate: a redemption
  records the true holder, so a win is credited to whoever actually collects
  it. If a winning position token is sold before redemption, the seller simply
  keeps their sale proceeds and the buyer realizes the win on redeeming — no
  prize is ever credited to someone who no longer holds the token. The cost is
  cosmetic: a resolved-but-unredeemed win contributes nothing until it is
  claimed (the line steps up at redemption rather than at resolution).

  Secondary sales also book the seller's allocated mint cost basis
  (`stake × tokensSold / minted`), so a seller who never redeems still has
  their stake deducted and combined PnL across buyer + seller conserves.

  Matches `VaultStat.cumulativePnl`, which realizes the same way.

  Known approximations (tracked for a planned PnL rework to a single cash-flow +
  token-ledger model): (1) basis allocation assumes sold tokens were minted ones
  when an address both mints and buys the same token; (2) a loss is recognized
  at its settlement/redemption event, so a position that simply expires
  worthless without an on-chain burn may book its loss late.
  """
  cumulativePnl: BigInt!

  """
  Predictions created in the bucket, across every outcome. Equals
  `predictionsWon + predictionsLost + predictionsPending +
  predictionsNonDecisive`.
  """
  predictionsTotal: Int!

  """
  Of the bucket's predictions, those that have since settled in the account's
  favor. Counts are bucketed by creation time but reflect each prediction's
  *current* settlement status, so a past bucket's won / lost / pending split
  shifts as its predictions resolve (the series is computed live, not
  snapshotted).
  """
  predictionsWon: Int!

  """Bucket predictions that have since settled against the account."""
  predictionsLost: Int!

  """Bucket predictions not yet settled."""
  predictionsPending: Int!

  """Bucket predictions that settled non-decisively (no winning side)."""
  predictionsNonDecisive: Int!
}

type AccountStatPointEdge {
  cursor: String!
  node: AccountStatPoint!
}

type AccountStatPointConnection {
  edges: [AccountStatPointEdge!]!
  nodes: [AccountStatPoint!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""
Filter for `Account.statsHistory`. Mirrors `VaultStatFilter`: a `timestamp`
window in epoch seconds (inclusive on both bounds), defaulting to the last
90 days when omitted.
"""
input AccountStatFilter {
  timestamp: IntRangeFilter
}

type AccountEdge {
  cursor: String!
  node: Account!
}

type AccountConnection {
  edges: [AccountEdge!]!
  nodes: [Account!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""
Filter input for `accounts`. Intentionally narrow — the only meaningful
filter dimension for an address-keyed table is substring match against
the address itself.
"""
input AccountFilter {
  """Substring search against the wallet address (case-insensitive)."""
  search: String

  """
  Chain to scope returned accounts to. Defaults to the deployment's chain
  (prod → mainnet, staging → testnet) when omitted.
  """
  chainId: Int
}

"""
Sort dimensions for the `accounts` connection. Intentionally kept as
an enum even though it currently carries one value — additional sort
columns (e.g. by stat-based ranking) can be added without a breaking
change to the `orderBy` arg shape.
"""
enum AccountOrderField {
  CREATED_AT
}

input AccountOrder {
  field: AccountOrderField!
  direction: OrderDirection!
}

"""
A statically configured protocol vault. Vaults are address-keyed like
accounts but contract-controlled, with their own deployment kind and
historical legacy aliases. The small total count means the connection
exists primarily for enumeration; per-vault refetch goes through
`vault(address:)`.
"""
type Vault implements Node {
  id: ID!

  """
  The vault's on-chain identity as an account: address, chainId, live wallet
  balance, ranking, and balance history. A vault *is* an account (by
  composition); its address and chain live here rather than being duplicated
  onto `Vault`.
  """
  account: Account!

  """
  Latest economic snapshot for this vault (balance, deployed/undeployed
  collateral, realized PnL, flows). `null` until the stats writer has
  recorded a first snapshot for the vault.

  DEFERRED — not built yet: this is currently the latest *recorded*
  snapshot. The target is a live, non-null chain read computed at query time
  (reusing v1's live-candle helpers in `sdl/resolvers/queries/analytics.ts`)
  so `/vaults` can drop its own `usePassiveLiquidityVault` RPC reads. Big
  lift: needs per-request chain reads, not just a snapshot lookup.
  """
  stats: VaultStat

  """
  Time-series of this vault's economic snapshots, oldest-first (ascending
  `timestamp`, matching `Account.statsHistory` — chart-ready, no consumer
  re-sort). Backs the vault dashboard's TVL / PnL charts.
  """
  statsHistory(first: Int = 30, after: String, filter: VaultStatFilter): VaultStatConnection!
}

"""
One economic snapshot of a vault, taken by the stats writer. Amounts are
wUSDe wei. Field names drop the leaked `vault*` Prisma column prefixes
(redundant under `Vault`) and use the schema's collateral vocabulary.
"""
type VaultStat {
  timestamp: UnixSeconds!

  """
  Raw wUSDe held by the vault contract (`balanceOf`), excludes deployed
  funds.
  """
  balance: BigInt!

  """Collateral deployed into escrow (backing open positions)."""
  deployedCollateral: BigInt!

  """
  Liquid collateral not yet deployed to escrow. `balance + deployed` is AUM.
  """
  undeployedCollateral: BigInt!

  """
  Settlement PnL: gross payouts to the vault minus its primary-creation collateral.
  """
  realizedPnl: BigInt!

  """
  Cumulative trading PnL the vault dashboard plots: settlement PnL plus net
  secondary-market flow (`realizedPnl + secondarySold − secondaryBought`).

  PnL realizes only when a position is actually redeemed/settled — it is NOT
  marked from still-unredeemed `claimableCollateral` (that term used to be
  added here and has been removed). This keeps the line correct when a winning
  token is sold before redemption: the redeemer collects the prize, so it is
  never credited to whoever merely minted the position. Realizes the same way
  as `AccountStatPoint.cumulativePnl`. Trade-off: a resolved-but-unredeemed win
  is not marked until it is claimed — the line steps up at redemption rather
  than at resolution, which can read as a brief paper dip in between.
  """
  cumulativePnl: BigInt!
  deposits: BigInt!
  withdrawals: BigInt!
  positionsWon: Int!
  positionsLost: Int!
  collateralWon: BigInt!
  collateralLost: BigInt!

  """
  wUSDe owed to the vault on resolved-but-not-yet-redeemed winning sides,
  net of what it has already claimed. The dashboard's TVL line adds this to
  `balance + deployedCollateral` so funds that have settled in the vault's
  favor but await an indexed redeem are not transiently dropped. A
  pending-balance figure for TVL only — deliberately NOT part of
  `cumulativePnl` (PnL realizes at redemption). Named to match
  `AccountStatPoint.claimableCollateral`, the account-level analog.
  """
  claimableCollateral: BigInt!
}

type VaultStatEdge {
  cursor: String!
  node: VaultStat!
}

type VaultStatConnection {
  edges: [VaultStatEdge!]!
  nodes: [VaultStat!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input VaultStatFilter {
  """Snapshot timestamp window in epoch seconds (inclusive)."""
  timestamp: IntRangeFilter
}

type VaultEdge {
  cursor: String!
  node: Vault!
}

type VaultConnection {
  edges: [VaultEdge!]!
  nodes: [Vault!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""
Filter for the `vaults` connection. Address filter exists primarily for
enumeration patterns that want to scope to a known vault — single-row
lookup should use `vault(address:)` instead.
"""
input VaultFilter {
  """
  Restrict to a single vault address (case-insensitive). Matches both the current primary and any legacy alias.
  """
  address: Address

  """
  Restrict to a single chain. Defaults to the SDK's default chain when omitted.
  """
  chainId: Int
}

"""
Sort dimensions for the `vaults` connection. Intentionally kept as an
enum even though it currently carries one value — symmetric with the
other plural-query `*OrderField` enums and reserves an additive seam
for future sort columns.
"""
enum VaultOrderField {
  ADDRESS
}

input VaultOrder {
  field: VaultOrderField!
  direction: OrderDirection!
}

"""
A category groups prediction conditions / condition groups for the
UI. Backed by the Postgres `Category` table.
"""
type Category implements Node {
  id: ID!
  name: String!
  slug: String!
  createdAt: DateTimeISO!
}

type CategoryEdge {
  cursor: String!
  node: Category!
}

type CategoryConnection {
  edges: [CategoryEdge!]!
  nodes: [Category!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input CategoryFilter {
  """Case-insensitive substring match against `name`."""
  search: String
}

enum CategoryOrderField {
  NAME
  CREATED_AT
}

input CategoryOrder {
  field: CategoryOrderField!
  direction: OrderDirection!
}

"""Range filter for an integer/UnixSeconds field; both bounds inclusive."""
input IntRangeFilter {
  gte: Int
  lte: Int
}

"""
An EAS forecast attestation — a user's probability forecast on a
condition. Identified publicly by the EAS attestation `uid` (the
`/forecast/<uid>` deep-link id). Forecasts are a separate timeline from
the Prediction/Trade activity feed and are intentionally NOT part of
the `ActivityItem` union (matches v1's design).
"""
type Forecast implements Node {
  id: ID!

  """EAS attestation uid — the public, shareable domain id."""
  uid: String!
  attester: Address!

  """Nullable — the attestation's conditionId column is nullable."""
  conditionId: Bytes
  condition: Condition

  """
  The forecast value — the attestation's prediction STRING column (a
  probability string), NOT a binary outcome.
  """
  value: String!
  comment: String
  schemaId: String!

  """From the attestation time column."""
  attestedAt: UnixSeconds!
}

type ForecastEdge {
  cursor: String!
  node: Forecast!
}

type ForecastConnection {
  edges: [ForecastEdge!]!
  nodes: [Forecast!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input ForecastFilter {
  attester: Address
  conditionIds: [Bytes!]
  schemaId: String
}

enum ForecastOrderField {
  ATTESTED_AT
}

input ForecastOrder {
  field: ForecastOrderField!
  direction: OrderDirection!
}

"""
Secondary-market trade — a peer-to-peer transfer of position tokens.
Identified by its canonical on-chain `tradeHash`. v2 wire shape uses
typed scalars throughout (`Address`, `Bytes32`, `BigInt`) where v1
returned plain `String!`.
"""
type Trade implements Node {
  id: ID!
  tradeHash: Bytes32!
  chainId: Int!
  buyer: Address!
  seller: Address!

  """Position token being transferred."""
  token: Address!

  """Collateral asset paid by the buyer."""
  collateral: Address!

  """
  Total collateral paid by the buyer, wei. `price / tokenAmount` is the per-share price.
  """
  price: BigInt!

  """Quantity of position tokens transferred, wei (18-dec)."""
  tokenAmount: BigInt!
  txHash: Bytes32!
  blockNumber: Int!
  executedAt: UnixSeconds!
  refCode: String

  """
  The pick configuration this trade's position `token` belongs to, or
  null if the token isn't part of any known configuration. Resolved by
  matching `token` against the configuration's predictor / counterparty
  tokens.
  """
  pickConfig: PickConfiguration

  """
  Which side of the pick configuration was traded — `PREDICTOR` if
  `token` is the predictor token, `COUNTERPARTY` otherwise. Null when
  `pickConfig` is null.
  """
  side: Side
}

type TradeEdge {
  cursor: String!
  node: Trade!
}

type TradeConnection {
  edges: [TradeEdge!]!
  nodes: [Trade!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input TradeFilter {
  tradeHash: Bytes32

  """
  Restrict to trades where the address is on either side (buyer or seller).
  Convenience filter for per-account activity feeds; mutually exclusive
  with `buyer` / `seller` (passing both wins toward `participant`).
  """
  participant: Address
  buyer: Address
  seller: Address
  tokens: [Address!]
  chainId: Int
  executedAt: IntRangeFilter
}

enum TradeOrderField {
  EXECUTED_AT
  BLOCK_NUMBER
}

input TradeOrder {
  field: TradeOrderField!
  direction: OrderDirection!
}

"""
On-chain prediction condition. v2 drops v1's legacy boolean flags
(`settled`, `resolvedToYes`, `nonDecisive`) in favour of the single
nullable `outcome` enum; clients should filter "settled" as
`outcome: { isNull: false }` (or `null` means not yet settled).

Heavy `similarMarket*` fields collapse into a nested `similarMarket`
value type — wire-weight reduction and grouping by source.
"""
type Condition implements Node {
  id: ID!

  """CTF on-chain condition id, lowercase 0x-hex."""
  conditionId: Bytes!
  chainId: Int!
  question: String!
  description: String!
  shortName: String
  optionName: String

  """Resolver (oracle) contract address that settles this condition."""
  resolver: Address!
  endTime: UnixSeconds!
  settledAt: UnixSeconds

  """
  Resolved state — `null` until the on-chain resolver returns. `YES` /
  `NO` are decisive resolutions of the binary outcome; `NON_DECISIVE`
  covers voided / tied / unresolvable settlements.
  """
  outcome: ConditionOutcome

  """
  Whether this condition has settled. v1-compat convenience derived from
  `outcome` (true when `outcome != null`); saves consumers re-deriving
  resolution state from the enum.
  """
  settled: Boolean!

  """
  Whether this condition settled decisively to YES. v1-compat convenience
  derived from `outcome` (true when `outcome == YES`).
  """
  resolvedToYes: Boolean!

  """
  Whether this condition settled non-decisively (void / tie / unresolvable).
  v1-compat convenience derived from `outcome` (true when
  `outcome == NON_DECISIVE`).
  """
  nonDecisive: Boolean!

  """Cumulative on-chain open interest, wei."""
  openInterest: BigInt!

  """YES probability from Polymarket (0.0–1.0), null for non-Polymarket."""
  estimatedPrice: Float

  """Visibility — false hides this condition from public listing surfaces."""
  isPublic: Boolean!
  displayOrder: Int
  tags: [String!]!
  createdAt: DateTimeISO!
  category: Category
  conditionGroup: ConditionGroup

  """Bundled similar-market signal from external sources (Polymarket)."""
  similarMarket: SimilarMarket

  """
  Flat mirror of `similarMarket.volume` — all-time external trading volume
  (USD). v1-compat convenience: v1 exposed these as flat string-indexed
  columns, so the flat form is kept alongside the nested `similarMarket`
  value type. `0` when no similar-market signal is present.
  """
  similarMarketVolume: Float!

  """
  Flat mirror of `similarMarket.volume1h`. `0` when no signal is present.
  """
  similarMarketVolume1h: Float!

  """
  Flat mirror of `similarMarket.volume4h`. `0` when no signal is present.
  """
  similarMarketVolume4h: Float!

  """
  Flat mirror of `similarMarket.volume24h`. `0` when no signal is present.
  """
  similarMarketVolume24h: Float!

  """
  Flat mirror of `similarMarket.volume7d`. `0` when no signal is present.
  """
  similarMarketVolume7d: Float!

  """
  Flat mirror of `similarMarket.volumeFiltered1h`. `0` when no signal is present.
  """
  similarMarketVolumeFiltered1h: Float!

  """
  Flat mirror of `similarMarket.volumeFiltered4h`. `0` when no signal is present.
  """
  similarMarketVolumeFiltered4h: Float!

  """
  Flat mirror of `similarMarket.volumeFiltered24h`. `0` when no signal is present.
  """
  similarMarketVolumeFiltered24h: Float!

  """
  Flat mirror of `similarMarket.volumeFiltered7d`. `0` when no signal is present.
  """
  similarMarketVolumeFiltered7d: Float!
}

enum ConditionOutcome {
  YES
  NO
  NON_DECISIVE
}

"""
Bundled similar-market signal for a Condition. All `volume*` fields are
USD trading volume on the linked external market over the listed window;
`volumeFiltered*` exclude pre-resolution / off-platform volume. Image
and `markets` carry the source-side metadata used to render an
attribution chip in the UI.
"""
type SimilarMarket {
  image: String

  """
  External market URLs (typically Polymarket links) the volume signal was
  aggregated from. Used by the UI to render an attribution chip.
  """
  markets: [String!]!
  volume: Float!
  volume1h: Float!
  volume4h: Float!
  volume24h: Float!
  volume7d: Float!
  volumeFiltered1h: Float!
  volumeFiltered4h: Float!
  volumeFiltered24h: Float!
  volumeFiltered7d: Float!
}

type ConditionEdge {
  cursor: String!
  node: Condition!
}

type ConditionConnection {
  edges: [ConditionEdge!]!
  nodes: [Condition!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input ConditionFilter {
  conditionIds: [Bytes!]

  """
  Match any of these resolver (oracle) contract addresses (case-insensitive).
  """
  resolvers: [Address!]
  chainId: Int

  """
  Restrict to a single category slug. Superseded by `categorySlugs` —
  when both are provided, `categorySlugs` wins.
  """
  categorySlug: String

  """
  Restrict to conditions whose category slug is in this set. OR within
  the set, AND with every other filter. Supersedes `categorySlug`.
  """
  categorySlugs: [String!]

  """
  `true` → only conditions with no parent group; `false` → only grouped.
  Omit for both.
  """
  ungrouped: Boolean

  """Restrict to settled (`outcome` non-null) / unsettled (null)."""
  settled: Boolean
  outcome: ConditionOutcome

  """
  Restrict to public (`true`) / hidden (`false`) conditions. Omit for
  both; listing surfaces default to public-only when this is omitted.
  """
  public: Boolean

  """Restrict to conditions tagged with at least one of these."""
  tags: [String!]

  """
  Substring search across `question` / `shortName` / `description`,
  case-insensitive.
  """
  search: String
  endTime: IntRangeFilter
}

enum ConditionOrderField {
  CREATED_AT
  END_TIME
  DISPLAY_ORDER
  OPEN_INTEREST
}

input ConditionOrder {
  field: ConditionOrderField!
  direction: OrderDirection!
}

"""
A named bundle of related conditions — used by the UI to group e.g.
"Who wins the Super Bowl" into one card with per-option conditions
underneath. The bundle exposes aggregated counters across its
constituent conditions.
"""
type ConditionGroup implements Node {
  id: ID!

  """
  Numeric DB id — the group's domain id (PLAN.md). Exists for the
  keeper's read→REST-write round-trip (SCHEMA_GAPS G3); admin REST
  routes key groups by this id.
  """
  groupId: Int!
  name: String!

  """
  External market URLs (typically Polymarket links) associated with this
  group, aggregated across its constituent conditions.
  """
  similarMarkets: [String!]!

  """
  Polymarket event id this group is keyed by — the canonical
  (source, externalEventId) identity. Null for groups created before
  event-keying or from non-Polymarket sources.
  """
  externalEventId: String

  """
  Whether this group is a negative-risk basket. Derived: true when the
  group carries a `negRiskMarketId` (the id itself stays admin-only).
  """
  negRisk: Boolean!
  createdAt: DateTimeISO!
  category: Category

  """Aggregated counters across this group's public conditions."""
  totals: ConditionGroupTotals!

  """Conditions in this group, ordered by `displayOrder` then `createdAt`."""
  conditions(first: Int = 50, after: String): ConditionConnection!
}

