name = "sapience-edge-cache"
main = "src/index.ts"
compatibility_date = "2025-03-26"

# Production: proxies api.sapience.xyz
[vars]
ORIGIN_URL = "https://api.sapience.xyz"

# Routes — uncomment after DNS is proxied through Cloudflare
# [[routes]]
# pattern = "api.sapience.xyz/graphql"
# zone_name = "sapience.xyz"

[env.staging]
name = "sapience-edge-cache-staging"
[env.staging.vars]
ORIGIN_URL = "https://api-staging.sapience.xyz"
