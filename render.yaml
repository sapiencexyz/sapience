databases:
  - name: database
    databaseName: foil
    plan: pro-4gb

services:
  - name: web-service
    type: web
    env: node
    plan: standard
    buildCommand: npm install -g pnpm@9 && bash render-build-sdk.sh
    startCommand: pnpm --filter @sapience/api start:service
    autoDeploy: true
    repo: https://github.com/sapiencexyz/sapience
    branch: main
    buildFilter:
      paths:
        - packages/api/**
        - packages/sdk/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: database
          property: connectionString

  - name: background-worker
    type: worker
    env: node
    plan: standard
    buildCommand: npm install -g pnpm@9 && bash render-build-sdk.sh && pnpm --filter @sapience/api prisma:generate
    startCommand: pnpm --filter @sapience/api start:worker
    autoDeploy: true
    branch: main
    buildFilter:
      paths:
        - packages/api/**
        - packages/sdk/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: database
          property: connectionString

  - name: relayer
    type: web
    env: node
    plan: standard
    buildCommand: npm install -g pnpm@9 && bash render-build-sdk.sh
    startCommand: pnpm --filter @sapience/relayer start
    autoDeploy: true
    repo: https://github.com/sapiencexyz/sapience
    branch: main
    buildFilter:
      paths:
        - packages/relayer/**
    envVars:
      - key: ENABLE_AUCTION_WS
        value: "true"

  - name: protocol-stats-cron
    type: cron
    env: node
    schedule: "0 0 * * *"
    buildCommand: npm install -g pnpm@9 && bash render-build-sdk.sh && pnpm --filter @sapience/api prisma:generate
    startCommand: pnpm --filter @sapience/api start:compute-stats
    branch: main
    buildFilter:
      paths:
        - packages/api/**
        - packages/sdk/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: database
          property: connectionString

  - name: polymarket-keeper-cron
    type: cron
    env: node
    schedule: "*/30 * * * *"
    buildCommand: npm install -g pnpm@9 && bash render-build-sdk.sh
    startCommand: NODE_ENV=production pnpm --filter @sapience/polymarket-keeper start
    branch: main
    buildFilter:
      paths:
        - packages/polymarket-keeper/**
        - packages/sdk/**
    envVars:
      - key: POLYGON_RPC_URL
        sync: false
      - key: ADMIN_PRIVATE_KEY
        sync: false
      - key: SAPIENCE_API_URL
        value: "https://api.sapience.xyz"
      - key: LLM_ENABLED
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "openai/gpt-4o-mini"
