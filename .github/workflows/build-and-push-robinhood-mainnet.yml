name: Build, push, and deploy (Robinhood mainnet)
# SCAFFOLD — the Robinhood mainnet chain/infra does not exist yet. This workflow
# is wired against the robinhood-mainnet Terraform stacks (cluster
# v1-robinhood-mainnet, ECR repos *-rh-main, role
# github-actions-sapience-v1-robinhood-mainnet). It will only work once those are
# applied and the mainnet chain config is filled in.
on:
  push:
    branches: [aws-robinhood-mainnet]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CI_ROLE_ARN: arn:aws:iam::372110443321:role/github-actions-sapience-v1-robinhood-mainnet
  ECS_CLUSTER: v1-robinhood-mainnet
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/api-service-rh-main:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/api-worker-rh-main:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/reconciler-rh-main:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/relayer-rh-main:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/market-keeper-rh-main:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Release gate: run `prisma migrate deploy` as a one-off Fargate task BEFORE
  # rolling any service. If it fails this job goes red, `deploy` never runs,
  # and the old task definitions keep serving untouched. The services no
  # longer run migrations at boot.
  migrate:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Register db-migrate task definition with the new image
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition db-migrate-rh-main \
            --query 'taskDefinition' > task-def.json
          NEW_IMAGE="${{ steps.ecr.outputs.registry }}/api-service-rh-main:${{ needs.build-and-push.outputs.image_tag }}"
          jq --arg img "$NEW_IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-def.json > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.[family,revision]' --output text

      - name: Run migration task and wait for completion
        run: |
          set -euo pipefail
          # Borrow api-service's live network config (private subnets + the
          # baseline SG with DB access) instead of hardcoding subnet/SG ids.
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services api-service-rh-main \
            --query 'services[0].networkConfiguration' --output json)
          RUN_OUTPUT=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition db-migrate-rh-main \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --enable-ecs-managed-tags \
            --tags key=Environment,value=v1-robinhood-mainnet key=Project,value=sapience key=Stack,value=sapience-core \
            --output json)
          TASK_ARN=$(echo "$RUN_OUTPUT" | jq -r '.tasks[0].taskArn // empty')
          if [ -z "$TASK_ARN" ]; then
            echo "run-task failed:" && echo "$RUN_OUTPUT" | jq '.failures'
            exit 1
          fi
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          DESCRIBE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --output json)
          EXIT_CODE=$(echo "$DESCRIBE" | jq -r '.tasks[0].containers[0].exitCode // "none"')
          STOP_REASON=$(echo "$DESCRIBE" | jq -r '.tasks[0].stoppedReason // ""')
          echo "Exit code: $EXIT_CODE ($STOP_REASON)"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed — release blocked, services untouched. Logs: /ecs/db-migrate-rh-main"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-service-rh-main
          - api-worker-rh-main
          - reconciler-rh-main
          - relayer-rh-main
          - market-keeper-rh-main
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ matrix.service }} \
            --query 'taskDefinition' \
            > task-def.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.service }}
          image: ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ needs.build-and-push.outputs.image_tag }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  refresh-scheduled-tasks:
    runs-on: ubuntu-latest
    # Gated on migrate too: compute-stats queries the DB, so its new revision
    # must not become latest if the schema migration failed.
    needs: [build-and-push, migrate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: compute-stats-rh-main
            source_repo: api-worker-rh-main
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Register new ${{ matrix.task }} task definition
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition ${{ matrix.task }} \
            --query 'taskDefinition' > task-def.json
          NEW_IMAGE="${{ steps.ecr.outputs.registry }}/${{ matrix.source_repo }}:${{ needs.build-and-push.outputs.image_tag }}"
          jq --arg img "$NEW_IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-def.json > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.[family,revision]' --output text
