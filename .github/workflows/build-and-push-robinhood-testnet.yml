name: Build, push, and deploy (Robinhood testnet)
on:
  push:
    branches: [aws-robinhood-testnet]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CI_ROLE_ARN: arn:aws:iam::372110443321:role/github-actions-sapience-robinhood-testnet
  ECS_CLUSTER: sapience-robinhood-testnet
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # One Dockerfile, one build, five tags (one ECR repo per service). The
      # repos carry the `-rh-test` suffix to stay unique in the shared AWS
      # account. Pushed in a single docker operation — shared layers, one push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/api-service-rh-test:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/api-worker-rh-test:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/reconciler-rh-test:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/relayer-rh-test:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/market-keeper-rh-test:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-service-rh-test
          - api-worker-rh-test
          - reconciler-rh-test
          - relayer-rh-test
          - market-keeper-rh-test
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ matrix.service }} \
            --query 'taskDefinition' \
            > task-def.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.service }}
          image: ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ needs.build-and-push.outputs.image_tag }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  refresh-scheduled-tasks:
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        include:
          # Scheduled tasks have no ECS service to update — register a new
          # revision. The EventBridge schedule targets the family (no revision
          # pinned), so the next fire picks up the new code.
          - task: compute-stats-rh-test
            source_repo: api-worker-rh-test
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Register new ${{ matrix.task }} task definition
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition ${{ matrix.task }} \
            --query 'taskDefinition' > task-def.json
          NEW_IMAGE="${{ steps.ecr.outputs.registry }}/${{ matrix.source_repo }}:${{ needs.build-and-push.outputs.image_tag }}"
          jq --arg img "$NEW_IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-def.json > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.[family,revision]' --output text
